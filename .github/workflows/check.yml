name: Preorder-Check

on:
  schedule:
    # Alle 10 Minuten (GitHub startet geplante Läufe manchmal ein paar Minuten später).
    # Bei einem PRIVATEN Repo auf "*/30 * * * *" stellen, sonst reichen die Gratis-Minuten nicht.
    - cron: "*/10 * * * *"
  workflow_dispatch: # erlaubt den Start per Knopfdruck unter "Actions"

permissions:
  contents: write # nur um state.json zurückzuspeichern

concurrency:
  group: preorder-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Shops prüfen
        run: python3 check.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Stand speichern
        run: |
          git config user.name "preorder-alarm"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Stand aktualisiert" && git push)
