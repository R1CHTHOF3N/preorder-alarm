name: Preorder-Check

on:
  schedule:
    # Alle 10 Minuten (GitHub startet geplante Läufe manchmal ein paar Minuten später).
    # Bei einem PRIVATEN Repo auf "*/30 * * * *" stellen, sonst reichen die Gratis-Minuten nicht.
    - cron: "*/10 * * * *"
  workflow_dispatch: # erlaubt den Start per Knopfdruck unter "Actions"

permissions:
  contents: write # um state.json zurückzuspeichern
  actions: read # um zu sehen, ob der vorige Lauf fehlgeschlagen ist

concurrency:
  group: preorder-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Shops prüfen
        timeout-minutes: 8 # hängt etwas, schlägt der Schritt fehl und der Alarm unten greift
        run: python3 check.py

      - name: Stand speichern
        run: |
          git config user.name "preorder-alarm"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Stand aktualisiert"
          # Der PS5-Pro-Check pusht in dasselbe Repo -> bei Konflikt kurz neu holen und nochmal.
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1

      # Discord-Meldung bei Absturz – nur beim ersten Fehlschlag, damit es nicht alle 10 Min. meldet.
      - name: Absturz melden
        if: failure()
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow check.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion' || echo unknown)
          if [ "$prev" = "failure" ]; then echo "Vorheriger Lauf schon fehlgeschlagen, bereits gemeldet."; exit 0; fi
          jq -n --arg u "$RUN_URL" \
            '{content: "@everyone", embeds: [{title: "❌ Preorder-Alarm ist abgestürzt", url: $u, color: 15158332,
              description: "Solange werden **keine** Preorders erkannt! Details: Titel anklicken."}], allowed_mentions: {parse: ["everyone"]}}' |
            curl -sSf --retry 3 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      - name: Entwarnung nach Absturz
        if: success()
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow check.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion' || echo unknown)
          if [ "$prev" != "failure" ]; then exit 0; fi
          jq -n '{content: "@everyone", embeds: [{title: "✅ Preorder-Alarm läuft wieder", color: 3066993}], allowed_mentions: {parse: ["everyone"]}}' |
            curl -sSf --retry 3 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL" || true
